<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Ralph Meet</title>

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;

          var customTheme =
            theme === "miku-light" ||
            theme === "miku-dark" ||
            theme === "spiderman-light" ||
            theme === "spiderman-dark"
              ? theme
              : null;

          if (customTheme) {
            document.documentElement.classList.add(customTheme);
          } else if (
            theme === "dark" ||
            (theme === "system" && prefersDark) ||
            (!theme && prefersDark)
          ) {
            document.documentElement.classList.add("dark");
          } else if (
            theme === "light" ||
            (theme === "system" && !prefersDark)
          ) {
            document.documentElement.classList.add("light");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap"
    />

    <style>
      /*
     * Safe area inset CSS variables
     */
      :root {
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
      }

      body {
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Prevent pull-to-refresh on Android */
      html,
      body {
        overflow: hidden;
        min-height: 100%;
        height: 100dvh;
      }

      #root {
        height: 100dvh;
        min-height: 100dvh;
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./mobile-entry.tsx"></script>
  </body>
</html>
