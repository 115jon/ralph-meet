pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,html,js,jsx,json,jsonc,cjs,mjs,cts,mts,md,ts,tsx,yaml,yml}"
      exclude:
        - "CHANGELOG.md"
        - "pnpm-lock.yaml"
        - "tools/oxlint/anti-slop/**"
        - ".agents/**"
      run: node_modules/.bin/oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    - name: lint
      glob: "*.{js,jsx,cjs,mjs,cts,mts,ts,tsx}"
      exclude:
        - "tools/oxlint/anti-slop/**"
        - ".agents/**"
      run: node_modules/.bin/oxlint --no-error-on-unmatched-pattern {staged_files}
    - name: typecheck
      run: pnpm run typecheck
