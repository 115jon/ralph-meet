name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 10

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 10

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test

  worker-runtime:
    name: worker-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 10

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure deterministic Worker test secrets
        shell: bash
        run: |
          cat > worker/.dev.vars <<'EOF'
          CALLS_APP_SECRET=ci-test-only-value
          CLERK_SECRET_KEY=ci-test-only-value
          TURN_TOKEN_SECRET=ci-test-only-value
          EOF

      - name: Run Worker tests
        run: pnpm run test:worker

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 10

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production output
        run: pnpm run build

  required:
    name: required
    if: ${{ always() }}
    needs:
      - quality
      - unit
      - worker-runtime
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          WORKER_RESULT: ${{ needs.worker-runtime.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || \
            "$UNIT_RESULT" != "success" || \
            "$WORKER_RESULT" != "success" || \
            "$BUILD_RESULT" != "success" ]]; then
            echo "CI failed: quality=$QUALITY_RESULT unit=$UNIT_RESULT worker=$WORKER_RESULT build=$BUILD_RESULT"
            exit 1
          fi
