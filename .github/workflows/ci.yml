name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled. Runs on main are allowed to finish
  # because they refresh the main-scoped pnpm cache that every PR restores from.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      # unit, worker-runtime, and build run for pull requests that touch code
      # and for manual runs. Pushes to main skip them: branch protection
      # requires `required` with strict up-to-date branches, and admins are
      # included, so every commit on main is the tree its PR already tested.
      code: ${{ steps.manual.outputs.code || steps.filter.outputs.code || 'false' }}
    steps:
      - name: Mark all files as relevant for manual runs
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "code=true" >> "$GITHUB_OUTPUT"

      - name: Detect code-affecting changes
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        # For pull_request events paths-filter lists changed files through the
        # GitHub API, so this job does not need a checkout.
        # dorny/paths-filter v3.0.4
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          filters: |
            code:
              - 'src/**'
              - 'realtime/**'
              - 'scripts/**'
              - 'public/**'
              - 'desktop/**'
              - 'mobile/**'
              - 'migrations/**'
              - 'patches/**'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.json'
              - '**/*.toml'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.sql'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.html'
              - '**/*.svg'
              - '.npmrc'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  quality:
    name: quality
    # Runs on main too: it is cheap, and its install keeps the main-scoped
    # pnpm store cache current after lockfile changes.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  unit:
    name: unit
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm

      - name: Run unit tests
        # The range-probe suite contacts YouTube and is an explicit live probe,
        # not a deterministic unit test. Keep it opt-in so CI is repeatable.
        run: pnpm exec vitest run --exclude src/lib/__tests__/ytdlp-range-probe.live.test.ts

  worker-runtime:
    name: worker-runtime
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm

      - name: Configure deterministic Worker test secrets
        shell: bash
        run: |
          cat > .dev.vars <<'EOF'
          CALLS_APP_SECRET=ci-test-only-value
          CLERK_SECRET_KEY=ci-test-only-value
          TURN_TOKEN_SECRET=ci-test-only-value
          REALTIME_TICKET_SECRET=ci-test-only-value
          EOF

      - name: Run Worker tests
        run: pnpm run test:worker

  build:
    name: build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm

      - name: Build production output
        run: pnpm run build

  required:
    name: required
    if: ${{ always() }}
    needs:
      - changes
      - quality
      - unit
      - worker-runtime
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          WORKER_RESULT: ${{ needs.worker-runtime.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || \
            "$QUALITY_RESULT" != "success" || \
            ( "$UNIT_RESULT" != "success" && "$UNIT_RESULT" != "skipped" ) || \
            ( "$WORKER_RESULT" != "success" && "$WORKER_RESULT" != "skipped" ) || \
            ( "$BUILD_RESULT" != "success" && "$BUILD_RESULT" != "skipped" ) ]]; then
            echo "CI failed: changes=$CHANGES_RESULT quality=$QUALITY_RESULT unit=$UNIT_RESULT worker=$WORKER_RESULT build=$BUILD_RESULT"
            exit 1
          fi
