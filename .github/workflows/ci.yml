name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.manual.outputs.code || steps.filter.outputs.code }}
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Mark all files as relevant for manual runs
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "code=true" >> "$GITHUB_OUTPUT"

      - name: Detect code-affecting changes
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        # dorny/paths-filter v3
        uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050
        with:
          filters: |
            code:
              - 'src/**'
              - 'realtime/**'
              - 'scripts/**'
              - 'public/**'
              - 'desktop/**'
              - 'mobile/**'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.json'
              - '**/*.toml'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.sql'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.html'
              - '**/*.svg'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 10

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  unit:
    name: unit
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 10

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        # The range-probe suite contacts YouTube and is an explicit live probe,
        # not a deterministic unit test. Keep it opt-in so CI is repeatable.
        run: pnpm exec vitest run --exclude src/lib/__tests__/ytdlp-range-probe.live.test.ts

  worker-runtime:
    name: worker-runtime
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 10

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure deterministic Worker test secrets
        shell: bash
        run: |
          cat > .dev.vars <<'EOF'
          CALLS_APP_SECRET=ci-test-only-value
          CLERK_SECRET_KEY=ci-test-only-value
          TURN_TOKEN_SECRET=ci-test-only-value
          REALTIME_TICKET_SECRET=ci-test-only-value
          EOF

      - name: Run Worker tests
        run: pnpm run test:worker

  build:
    name: build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 10

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production output
        run: pnpm run build

  required:
    name: required
    if: ${{ always() }}
    needs:
      - changes
      - quality
      - unit
      - worker-runtime
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          WORKER_RESULT: ${{ needs.worker-runtime.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || \
            "$QUALITY_RESULT" != "success" || \
            ( "$UNIT_RESULT" != "success" && "$UNIT_RESULT" != "skipped" ) || \
            ( "$WORKER_RESULT" != "success" && "$WORKER_RESULT" != "skipped" ) || \
            ( "$BUILD_RESULT" != "success" && "$BUILD_RESULT" != "skipped" ) ]]; then
            echo "CI failed: changes=$CHANGES_RESULT quality=$QUALITY_RESULT unit=$UNIT_RESULT worker=$WORKER_RESULT build=$BUILD_RESULT"
            exit 1
          fi
