name: CI Bootstrap

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and Worker tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # v6.0.9
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 10

      - name: Setup Node.js
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure deterministic Worker test secrets
        shell: bash
        run: |
          cat > worker/.dev.vars <<'EOF'
          CALLS_APP_SECRET=ci-test-only-value
          CLERK_SECRET_KEY=ci-test-only-value
          TURN_TOKEN_SECRET=ci-test-only-value
          EOF

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Worker tests
        run: pnpm run test:worker
