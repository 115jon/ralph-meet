name: "Desktop Release"

on:
  # release-please.yml calls this workflow as soon as it creates the release.
  # It used to run on `push: tags`, but a tag-triggered run saves its caches
  # under that tag's ref, and no later release can restore them, so every
  # release built cargo-tauri and the whole target dir from scratch. Calls from
  # release-please, and manual runs from main, save caches on main, which every
  # later run can read.
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to build and publish (for example v1.14.0)"
        required: true
        type: string
      publish:
        description: "Upload to the release and publish it"
        required: false
        default: true
        type: boolean
  # Manual rebuild of an existing release from the Actions tab. Run it from
  # main so the caches it saves stay reusable.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and publish (for example v1.14.0)"
        required: true
        type: string
      publish:
        description: "Upload to the release and publish it. Off: sign and verify only, and keep the installer as a workflow artifact."
        required: false
        default: true
        type: boolean

env:
  CARGO_INCREMENTAL: 0
  CEF_PATH: D:\cef
  RALPH_GAME_CAPTURE_HOOK: "1"
  RALPH_CAPTURE_POLICY: "wgc-enabled"
  RELEASE_TAG: ${{ inputs.release_tag }}
  VITE_RALPH_CAPTURE_POLICY: "wgc-enabled"
  # Signer common name on the Artifact Signing public-trust certificate.
  ARTIFACT_SIGNING_SIGNER: "Jonathan Martinez"

jobs:
  build:
    permissions:
      contents: write
      # OIDC token for azure/login (Artifact Signing). No Azure secret is stored.
      id-token: write

    # Windows-only: macOS and Linux builds are excluded until those
    # platforms are ready for release distribution.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--config src-tauri/tauri.deployed.conf.json --features cef,native-screen-share,game-capture-hook"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          # fetch-depth 1 (the default) makes the submodule fetch shallow too.
          submodules: recursive

      # ── Rust ────────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          components: llvm-tools

      - name: Capture Rust version
        id: rust-version
        shell: pwsh
        run: |
          $release = ((rustc -Vv | Select-String '^release:').ToString().Split(':', 2)[1]).Trim()
          "release=$release" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Cache Cargo home / registry state separately from the local target dir.
      # The heavyweight target artifacts for the Tauri fork and other in-repo
      # path crates are restored by a source-keyed cache below.
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          # Keep rust-cache focused on Cargo home / registry state. The expensive
          # local path crates (tauri-fork, cef-fork, vendored plugins, app code)
          # are cached separately with a source-keyed target snapshot below.
          cache-targets: false
          cache-bin: false

      - name: Restore desktop Rust target cache
        id: restore-desktop-target
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: desktop/src-tauri/target
          key: >-
            desktop-target-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust-version.outputs.release }}-${{ hashFiles(
              'desktop/src-tauri/Cargo.lock',
              'desktop/src-tauri/Cargo.toml',
              'desktop/src-tauri/build.rs',
              'desktop/packaging/payload-manifest.json',
              'desktop/src-tauri/tauri.conf.json',
              'desktop/src-tauri/tauri.deployed.conf.json',
              'desktop/src-tauri/src/**/*.rs',
              'desktop/src-tauri/vendor/**/*',
              'desktop/src-tauri/cef-fork/**/*',
              'desktop/src-tauri/tauri-fork/**/*'
            ) }}
          restore-keys: |
            desktop-target-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust-version.outputs.release }}-

      # ── Node.js + pnpm ──────────────────────────────────────────────
      # pnpm must be set up BEFORE setup-node so that the node cache
      # key can include the pnpm lockfile hash.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10 # match the version used locally

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      # ── C# installer ────────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # Run before the payload is packed so the installer under test builds
      # without the embedded ~150 MB resource.
      - name: Test C# installer
        run: dotnet test desktop/installer.tests --nologo

      # ── Install dependencies ─────────────────────────────────────────
      # We only need dependencies for the desktop app.
      # Filtering the installation avoids downloading huge unrelated packages like workerd / wrangler.
      - name: Configure pnpm network settings
        run: |
          pnpm config set fetch-retries 5
          pnpm config set fetch-retry-mintimeout 20000
          pnpm config set fetch-retry-maxtimeout 120000

      - name: Install desktop dependencies
        run: pnpm install --filter ralph-meet... --filter ralph-meet-desktop... --frozen-lockfile

      # ── Download Custom CEF ──────────────────────────────────────────
      - name: Download custom CEF
        run: |
          gh release download cef-build-assets --repo ${{ github.repository }} --pattern "cef-windows-x64.zip" --dir cef-temp
          Expand-Archive -Path cef-temp/cef-windows-x64.zip -DestinationPath D:\cef
          Remove-Item -Recurse -Force cef-temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The game-capture hook ships as OBS Studio's own signed release files,
      # unmodified (desktop/packaging/obs-signed-hook.lock.json). Their GPL-2.0
      # corresponding source (OBS sources, Detours, obs-deps) is downloaded,
      # checked against the same lock, and attached to this release below.
      - name: Fetch and verify OBS-signed capture hook and its source
        shell: pwsh
        run: ./desktop/scripts/fetch-obs-signed-hook.ps1 -CacheDir "$env:RUNNER_TEMP\obs-signed-hook" -SourcesDir "$env:RUNNER_TEMP\obs-signed-sources"

      # Key the CLI on the feat/cef commit so a release reuses the cached binary
      # until upstream moves (every few weeks). The cache used to be keyed on a
      # fixed string and saved per tag, so it never hit; when it did, it would
      # have pinned a stale CLI forever.
      - name: Resolve cargo-tauri fork revision
        id: tauri-cli
        shell: pwsh
        run: |
          $rev = ((git ls-remote https://github.com/tauri-apps/tauri refs/heads/feat/cef) -split '\s+')[0]
          if (-not $rev) { throw "Could not resolve tauri-apps/tauri feat/cef" }
          "rev=$rev" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache cargo-tauri
        id: cache-cargo-tauri
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-cargo-tauri-cef-${{ steps.tauri-cli.outputs.rev }}

      - name: Install cargo-tauri fork CLI
        if: steps.cache-cargo-tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --git https://github.com/tauri-apps/tauri --rev ${{ steps.tauri-cli.outputs.rev }}

      # ── Build & Release ─────────────────────────────────────────────
      - name: Build Tauri app binary
        shell: pwsh
        run: |
          Set-Location desktop
          cargo tauri build --config src-tauri/tauri.deployed.conf.json --features cef,native-screen-share,game-capture-hook --no-bundle

      # The root Yap.exe launcher stub (docs/desktop/launch.md). A small
      # standalone crate with no Tauri or CEF dependencies; it builds in seconds.
      - name: Build root launcher
        shell: pwsh
        run: |
          cargo build --release --manifest-path desktop/launcher/Cargo.toml
          $stub = Get-Item "desktop/launcher/target/release/yap-launcher.exe"
          Write-Host "==> yap-launcher.exe: $([math]::Round($stub.Length / 1KB)) KB"

      - name: Save desktop Rust target cache
        if: steps.restore-desktop-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: desktop/src-tauri/target
          key: ${{ steps.restore-desktop-target.outputs.cache-primary-key }}

      # ── Authenticode (Azure Artifact Signing) ───────────────────────
      # OIDC federated credential on the app registration in repo variable
      # AZURE_CLIENT_ID; it trusts this repo's main branch and v* tags only.
      # The service principal holds only Artifact Signing Certificate Profile
      # Signer, with no subscription access. See CODE_SIGNING_POLICY.md.
      - name: Azure login for Artifact Signing
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Sign our own binaries and the custom-built CEF binaries in place, before
      # stage-payload.ps1 packs them. The OBS-signed capture files
      # (obs-capture/obs-signed/graphics-hook*.dll, inject-helper*,
      # get-graphics-offsets*) are deliberately not listed: they must keep OBS's
      # own signature, and stage-payload.ps1 fails if their hashes change.
      - name: Sign app, launcher, and CEF binaries
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\desktop\src-tauri\target\release\ralph-meet-desktop.exe
            ${{ github.workspace }}\desktop\launcher\target\release\yap-launcher.exe
            ${{ env.CEF_PATH }}\libcef.dll
            ${{ env.CEF_PATH }}\chrome_elf.dll
            ${{ env.CEF_PATH }}\bootstrap.exe
            ${{ env.CEF_PATH }}\bootstrapc.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Yap
          description-url: https://yap.115jon.com

      # The checkout above is the release tag, which may predate the verify
      # script; take it from the commit this workflow runs from.
      - name: Check out the signature verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: desktop/scripts/verify-authenticode.ps1
          sparse-checkout-cone-mode: false

      - name: Verify payload signatures
        shell: pwsh
        run: |
          ./.release-tools/desktop/scripts/verify-authenticode.ps1 -ExpectedSigner $env:ARTIFACT_SIGNING_SIGNER -Path @(
            "desktop/src-tauri/target/release/ralph-meet-desktop.exe",
            "desktop/launcher/target/release/yap-launcher.exe",
            "$env:CEF_PATH\libcef.dll",
            "$env:CEF_PATH\chrome_elf.dll",
            "$env:CEF_PATH\bootstrap.exe",
            "$env:CEF_PATH\bootstrapc.exe"
          )

      # What ships is defined once in desktop/packaging/payload-manifest.json.
      # The script fails on any missing file, stages the payload, and packs it
      # into desktop/installer/Assets/payload.rmpk (see docs/desktop/packaging.md).
      # CEF files come straight from the CEF directory, so the old copy of them
      # into target/release is not needed here (build.rs still syncs it for dev runs).
      - name: Stage and pack payload
        shell: pwsh
        run: ./desktop/scripts/stage-payload.ps1 -CefDir $env:CEF_PATH

      - name: Build C# installer
        shell: pwsh
        run: |
          $TauriConf = Get-Content -Raw -Path "desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $Version = $TauriConf.version
          $Publisher = $TauriConf.bundle.publisher
          $ProductName = $TauriConf.productName
          $InstallerDisplayName = $TauriConf.app.windows[0].title
          dotnet build desktop/installer/installer.csproj -c Release -p:Version=$Version -p:InformationalVersion=$Version -p:Company="$Publisher" -p:Product="$InstallerDisplayName Setup"

          # The csproj embeds the payload only if it exists; never ship an installer without it.
          $setupSize = (Get-Item "desktop/installer/bin/Release/net48/YapSetup.exe").Length
          $payloadSize = (Get-Item "desktop/installer/Assets/payload.rmpk").Length
          if ($setupSize -lt $payloadSize) {
            throw "YapSetup.exe ($setupSize bytes) is smaller than its payload ($payloadSize bytes): the payload was not embedded."
          }
          Write-Host "==> YapSetup.exe: $([math]::Round($setupSize / 1MB, 1)) MB (payload $([math]::Round($payloadSize / 1MB, 1)) MB)"

      # Authenticode-sign the installer before the minisign step below: the
      # updater signature in latest.json must cover the final bytes.
      - name: Sign installer
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\desktop\installer\bin\Release\net48\YapSetup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Yap Setup
          description-url: https://yap.115jon.com

      - name: Verify installer signature
        shell: pwsh
        run: ./.release-tools/desktop/scripts/verify-authenticode.ps1 -ExpectedSigner $env:ARTIFACT_SIGNING_SIGNER -Path "desktop/installer/bin/Release/net48/YapSetup.exe"

      - name: Create draft release, sign updater metadata, and upload
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 1. Create or verify the draft release
          $Publish = $env:PUBLISH -eq 'true'
          $releaseExists = -not $Publish
          try {
              $info = & gh release view $env:RELEASE_TAG -R ${{ github.repository }} 2>$null
              if ($LASTEXITCODE -eq 0) {
                  $releaseExists = $true
              }
          } catch {}

          if (-not $releaseExists) {
              Write-Host "Creating draft release..."
              & gh release create $env:RELEASE_TAG --draft --title "Yap $env:RELEASE_TAG" --notes "Yap Release" -R ${{ github.repository }}
          }

          # 2. Sign the Authenticode-signed installer for the updater (minisign)
          $SetupRenamePath = "desktop/installer/bin/Release/net48/YapSetup.exe"
          Write-Host "==> Signing YapSetup.exe for the updater..."
          if ($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
              cargo tauri signer sign -k $env:TAURI_SIGNING_PRIVATE_KEY -p $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD $SetupRenamePath
          } else {
              cargo tauri signer sign -k $env:TAURI_SIGNING_PRIVATE_KEY $SetupRenamePath
          }

          # Read signature from the generated .sig file
          $SigPath = "$SetupRenamePath.sig"
          if (-not (Test-Path $SigPath)) {
              throw "Signature file was not generated!"
          }
          $Signature = (Get-Content -Raw -Path $SigPath).Trim()

          # Get version from tauri.conf.json
          $TauriConf = Get-Content -Raw -Path "desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $Version = $TauriConf.version

          # Construct the latest.json updater metadata
          $TagName = $env:RELEASE_TAG
          $Repo = "${{ github.repository }}"
          $Url = "https://github.com/$Repo/releases/download/$TagName/YapSetup.exe"
          $PubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          $Metadata = @{
              version = $Version
              pub_date = $PubDate
              platforms = @{
                  "windows-x86_64" = @{
                      signature = $Signature
                      url = $Url
                  }
              }
          }

          $Metadata | ConvertTo-Json -Depth 5 | Set-Content -Path "desktop/installer/bin/Release/net48/latest.json" -NoNewline
          Write-Host "==> Generated latest.json with version $Version and signature successfully!"

          # 3. Refuse to publish an updater manifest that would strand existing installs
          $LatestJsonPath = "desktop/installer/bin/Release/net48/latest.json"
          ./desktop/scripts/validate-latest-json.ps1 -LatestJson $LatestJsonPath -TauriConf "desktop/src-tauri/tauri.conf.json" -Tag $TagName -Repo $Repo

          if (-not $Publish) {
              Write-Host "==> publish is off: skipping release upload and publish."
              return
          }

          # 4. Upload artifacts to the release
          gh release upload $env:RELEASE_TAG $SetupRenamePath --clobber -R ${{ github.repository }}
          gh release upload $env:RELEASE_TAG $LatestJsonPath --clobber -R ${{ github.repository }}

          # GPL-2.0 corresponding source for the OBS capture binaries in the
          # installer (obs-capture/SOURCE-OFFER.md points here).
          Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\obs-signed-sources" -File | ForEach-Object {
              gh release upload $env:RELEASE_TAG $_.FullName --clobber -R ${{ github.repository }}
          }

          # 5. Publish the release and mark it as latest
          gh release edit $env:RELEASE_TAG --draft=false --latest -R ${{ github.repository }}

      - name: Keep signed installer as a workflow artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YapSetup-${{ env.RELEASE_TAG }}-signed
          path: |
            desktop/installer/bin/Release/net48/YapSetup.exe
            desktop/installer/bin/Release/net48/YapSetup.exe.sig
            desktop/installer/bin/Release/net48/latest.json
          retention-days: 7
