name: Desktop Validation

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-validation.yml"
      - ".github/actions/setup-pnpm/**"
      - ".gitmodules"
      - "desktop/**"
      # The desktop Vite bundle compiles the shared web app from the root.
      - "src/**"
      - "public/**"
      - "patches/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
  # Pull request runs can only restore caches saved on their own PR ref or on
  # main. This post-merge run exists to save the Rust and CEF caches on main,
  # so the next desktop PR starts warm instead of compiling from scratch.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-validation.yml"
      - ".gitmodules"
      - "desktop/src-tauri/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CEF_PATH: D:\cef
  # Bump the suffix when the cef-build-assets release asset changes.
  CEF_CACHE_KEY: desktop-cef-Windows-X64-v1

concurrency:
  group: desktop-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      # Pushes and manual runs always check the Rust crate.
      rust: ${{ steps.filter.outputs.rust || 'true' }}
    steps:
      - name: Detect Rust-affecting changes
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        # dorny/paths-filter v3.0.4
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          filters: |
            rust:
              - '.github/workflows/desktop-validation.yml'
              - '.gitmodules'
              - 'desktop/src-tauri/**'

  desktop:
    name: desktop
    needs: changes
    # The Rust check needs Windows (CEF and Win32 crates). A web-only change
    # only needs the Vite bundle, which builds the same on Linux and skips the
    # submodule checkout, CEF download, and cargo check.
    runs-on: ${{ needs.changes.outputs.rust == 'true' && 'windows-latest' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        # actions/checkout v4.4.0. With the default fetch-depth of 1, the
        # tauri-fork submodule is also fetched with --depth=1.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: ${{ needs.changes.outputs.rust == 'true' && 'recursive' || 'false' }}

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm
        with:
          install-args: --filter ralph-meet... --filter ralph-meet-desktop...

      - name: Build desktop frontend
        run: pnpm --dir desktop run build:vite

      - name: Restore CEF runtime cache
        id: cef-cache
        if: ${{ needs.changes.outputs.rust == 'true' }}
        # actions/cache v4.3.0
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: D:\cef
          key: ${{ env.CEF_CACHE_KEY }}

      - name: Download custom CEF
        if: ${{ needs.changes.outputs.rust == 'true' && steps.cef-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          gh release download cef-build-assets --repo ${{ github.repository }} --pattern "cef-windows-x64.zip" --dir cef-temp
          Expand-Archive -Path cef-temp/cef-windows-x64.zip -DestinationPath D:\cef
          Remove-Item -Recurse -Force cef-temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save CEF runtime cache
        # Save on main only. A PR-scoped copy would be unreadable to every
        # other PR and would only use up the repository's 10 GB cache quota.
        if: ${{ needs.changes.outputs.rust == 'true' && steps.cef-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        # actions/cache v4.3.0
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: D:\cef
          key: ${{ env.CEF_CACHE_KEY }}

      - name: Setup Rust
        if: ${{ needs.changes.outputs.rust == 'true' }}
        # dtolnay/rust-toolchain stable branch (2026-10-16)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: llvm-tools

      - name: Rust cache
        if: ${{ needs.changes.outputs.rust == 'true' }}
        # Swatinem/rust-cache v2.9.3
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: desktop/src-tauri -> target
          # Same reason as the CEF cache: PRs restore main's copy, and only main
          # writes one.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check desktop Rust crate
        if: ${{ needs.changes.outputs.rust == 'true' }}
        # The existing desktop lockfile predates the current manifest and is
        # intentionally not enforced by the Desktop Release job.
        # Match that established release behavior instead of making lockfile
        # repair part of this validation workflow.
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
