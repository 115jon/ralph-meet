name: Desktop Validation

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-validation.yml"
      - ".github/workflows/desktop-release.yml"
      - ".github/actions/setup-pnpm/**"
      - ".gitmodules"
      - "desktop/**"
      # The desktop Vite bundle compiles the shared web app from the root.
      - "src/**"
      - "public/**"
      - "patches/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
  # Pull request runs can only restore caches saved on their own PR ref or on
  # main. This post-merge run exists to save the Rust and CEF caches on main,
  # so the next desktop PR starts warm instead of compiling from scratch.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-validation.yml"
      - ".github/workflows/desktop-release.yml"
      - ".gitmodules"
      - "desktop/src-tauri/**"
      - "desktop/installer/**"
      - "desktop/installer.tests/**"
      - "desktop/launcher/**"
      - "desktop/packaging/**"
      - "desktop/scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CEF_PATH: D:\cef
  # Bump the suffix when the cef-build-assets release asset changes.
  CEF_CACHE_KEY: desktop-cef-Windows-X64-v1

concurrency:
  group: desktop-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      # Pushes and manual runs always check the Rust crate.
      rust: ${{ steps.filter.outputs.rust || 'true' }}
    steps:
      - name: Detect Rust-affecting changes
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        # dorny/paths-filter v3.0.4
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          filters: |
            rust:
              - '.github/workflows/desktop-validation.yml'
              - '.gitmodules'
              - 'desktop/src-tauri/**'
              # build.rs and the packaging tests read the payload manifest.
              - 'desktop/packaging/payload-manifest.json'

  desktop:
    name: desktop
    needs: changes
    # The Rust check needs Windows (CEF and Win32 crates). A web-only change
    # only needs the Vite bundle, which builds the same on Linux and skips the
    # submodule checkout, CEF download, and cargo check.
    runs-on: ${{ needs.changes.outputs.rust == 'true' && 'windows-latest' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        # actions/checkout v4.4.0. With the default fetch-depth of 1, the
        # tauri-fork submodule is also fetched with --depth=1.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: ${{ needs.changes.outputs.rust == 'true' && 'recursive' || 'false' }}

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm
        with:
          install-args: --filter ralph-meet... --filter ralph-meet-desktop...

      - name: Build desktop frontend
        run: pnpm --dir desktop run build:vite

      - name: Restore CEF runtime cache
        id: cef-cache
        if: ${{ needs.changes.outputs.rust == 'true' }}
        # actions/cache v4.3.0
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: D:\cef
          key: ${{ env.CEF_CACHE_KEY }}

      - name: Download custom CEF
        if: ${{ needs.changes.outputs.rust == 'true' && steps.cef-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          gh release download cef-build-assets --repo ${{ github.repository }} --pattern "cef-windows-x64.zip" --dir cef-temp
          Expand-Archive -Path cef-temp/cef-windows-x64.zip -DestinationPath D:\cef
          Remove-Item -Recurse -Force cef-temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save CEF runtime cache
        # Save on main only. A PR-scoped copy would be unreadable to every
        # other PR and would only use up the repository's 10 GB cache quota.
        if: ${{ needs.changes.outputs.rust == 'true' && steps.cef-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        # actions/cache v4.3.0
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: D:\cef
          key: ${{ env.CEF_CACHE_KEY }}

      - name: Setup Rust
        if: ${{ needs.changes.outputs.rust == 'true' }}
        # dtolnay/rust-toolchain stable branch (2026-10-16)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: llvm-tools

      - name: Rust cache
        if: ${{ needs.changes.outputs.rust == 'true' }}
        # Swatinem/rust-cache v2.9.3
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: desktop/src-tauri -> target
          # Same reason as the CEF cache: PRs restore main's copy, and only main
          # writes one.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The game-capture-hook feature makes build.rs require the OBS capture
      # binaries (they are not committed). Build them exactly like the release
      # workflow so this job checks the feature set that actually ships.
      - name: Restore OBS capture binaries cache
        if: ${{ needs.changes.outputs.rust == 'true' }}
        id: obs-capture-cache
        # actions/cache v4.3.0
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            desktop/src-tauri/resources/obs-capture/*.dll
            desktop/src-tauri/resources/obs-capture/*.exe
          key: obs-capture-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/resources/obs-capture/fork/**', 'desktop/scripts/build-capture-fork.ps1') }}

      - name: Build OBS game capture binaries from source
        if: ${{ needs.changes.outputs.rust == 'true' && steps.obs-capture-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: ./desktop/scripts/build-capture-fork.ps1 -Arch both -Config Release -FetchDetours

      - name: Save OBS capture binaries cache
        if: ${{ needs.changes.outputs.rust == 'true' && steps.obs-capture-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        # actions/cache v4.3.0
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            desktop/src-tauri/resources/obs-capture/*.dll
            desktop/src-tauri/resources/obs-capture/*.exe
          key: ${{ steps.obs-capture-cache.outputs.cache-primary-key }}

      - name: Check desktop Rust crate
        if: ${{ needs.changes.outputs.rust == 'true' }}
        env:
          RALPH_GAME_CAPTURE_HOOK: "1"
          RALPH_CAPTURE_POLICY: "wgc-enabled"
        # The existing desktop lockfile predates the current manifest and is
        # intentionally not enforced by the Desktop Release job.
        # Match that established release behavior instead of making lockfile
        # repair part of this validation workflow.
        # With game-capture-hook, build.rs also fails if the payload manifest
        # stops shipping any required obs-capture material (GPLv2 documents).
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --features cef,native-screen-share,game-capture-hook

  # The root RalphMeet.exe launcher stub (desktop/launcher). Standalone crate
  # with no Tauri or CEF dependencies, so it needs none of the desktop job's setup.
  launcher:
    name: launcher
    runs-on: windows-latest

    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Rust
        # dtolnay/rust-toolchain stable branch (2026-10-16)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy, rustfmt

      - name: Check, test and build the launcher
        shell: pwsh
        working-directory: desktop/launcher
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt --check failed" }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          cargo test
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "cargo build --release failed" }
          $stub = Get-Item "target/release/ralph-meet-launcher.exe"
          Write-Host "==> ralph-meet-launcher.exe: $([math]::Round($stub.Length / 1KB)) KB"

  # Installer, payload format, and packaging scripts. Windows only (WPF, net48),
  # and independent of the Rust job: it needs no CEF, cargo build, or pnpm.
  installer:
    name: installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x

      - name: Test C# installer
        run: dotnet test desktop/installer.tests --nologo

      # Stages synthetic inputs through desktop/packaging/payload-manifest.json,
      # packs them with PayloadPacker, decodes and compares, and checks that a
      # missing manifest file fails staging.
      - name: Test payload pipeline
        shell: pwsh
        run: ./desktop/scripts/test-payload-pipeline.ps1
