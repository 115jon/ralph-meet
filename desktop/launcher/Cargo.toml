[package]
name = "yap-launcher"
version = "3.14.0"
description = "Yap root launcher: starts the active app-<version> Yap.exe"
authors = ["115jon"]
license = "MIT"
edition = "2021"
publish = false

# Standalone crate: no Tauri, CEF or app dependencies. See docs/desktop/launch.md.
[workspace]

[[bin]]
name = "yap-launcher"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Environment",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
