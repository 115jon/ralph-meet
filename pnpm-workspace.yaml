packages:
  - '.'
  - 'desktop'
  - 'mobile'
  - 'worker'
  - 'packages/*'

allowBuilds:
  bufferutil: true
  esbuild: true
  msw: true
  sharp: true
  utf-8-validate: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
  - workerd

minimumReleaseAge: 10080
trustPolicy: no-downgrade
