packages:
  - "."
  - "desktop"
  - "mobile"
  - "apps/*"
  - "packages/*"

allowBuilds:
  bufferutil: true
  esbuild: true
  msw: true
  sharp: true
  utf-8-validate: true
  workerd: true

minimumReleaseAgeExclude:
  # Worker Previews need wrangler >= 4.135.0; keep the Cloudflare toolchain on
  # the release that ships them even when it is newer than the release-age gate.
  - "@cloudflare/vite-plugin@1.66.0"
  - "@cloudflare/vitest-plugin@1.4.11"
  - wrangler@4.156.0

# One Wrangler and one Miniflare for the CLI, the Vite plugin and the Vitest
# plugin: the Vite plugin pins an older patch release of both.
overrides:
  "@cloudflare/vite-plugin>miniflare": 5.20261023.3-beta
  "@cloudflare/vite-plugin>wrangler": 4.156.0

onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
  - workerd
patchedDependencies:
  partytracks@0.0.56: patches/partytracks@0.0.56.patch
